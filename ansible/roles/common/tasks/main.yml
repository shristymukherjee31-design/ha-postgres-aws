---
# Installs PostgreSQL 16 and ensures the service is running.
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install PostgreSQL 16 and client tools
  ansible.builtin.apt:
    name:
      - postgresql-16
      - postgresql-client-16
      - python3-psycopg2
    state: present

- name: Ensure PostgreSQL is enabled and running
  ansible.builtin.systemd:
    name: postgresql
    state: started
    enabled: true

# Listen on all interfaces so clients (via db.internal) can reach whichever
# node is the current primary.
- name: Configure PostgreSQL to listen on all interfaces
  ansible.builtin.copy:
    dest: "/etc/postgresql/{{ pg_version }}/main/conf.d/10-network.conf"
    content: |
      # Managed by Ansible.
      listen_addresses = '*'
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart PostgreSQL

- name: Allow client connections from inside the VPC
  ansible.builtin.lineinfile:
    path: "/etc/postgresql/{{ pg_version }}/main/pg_hba.conf"
    line: "host all all {{ vpc_cidr }} scram-sha-256"
    state: present
  notify: Restart PostgreSQL
